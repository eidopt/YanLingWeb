name: agent-eval

on:
  push:
    branches: [master]
    paths:
      - 'scripts/agent-eval/**'
      - 'shared/agent/**'
      - 'backend/src/ai-templates/**'
      - 'src/ai/core/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/agent-eval.yml'
  pull_request:
    branches: [master]
    paths:
      - 'scripts/agent-eval/**'
      - 'shared/agent/**'
      - 'backend/src/ai-templates/**'
      - 'src/ai/core/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/agent-eval.yml'
  workflow_dispatch:

concurrency:
  group: agent-eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  agent-eval:
    name: agent eval (mock)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.1.2'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run agent eval (mock)
        run: pnpm agent:evaluate

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-report
          path: output/agent-eval/
          retention-days: 7
          if-no-files-found: warn
